name: coverage

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'jacoco.xml'
      - '.github/badges/**'
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests with JaCoCo
        run: mvn -B test

      - name: Generate coverage badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          badges-directory: .github/badges

      - name: Copy JaCoCo XML report to repository root
        run: cp target/site/jacoco/jacoco.xml jacoco.xml

      - name: Commit report and badges
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jacoco.xml .github/badges
          if git diff --cached --quiet; then
            echo "No coverage changes to commit."
          else
            git commit -m "Update JaCoCo report and coverage badges"
            git push
          fi
