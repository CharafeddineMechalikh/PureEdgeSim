<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">A service graph spread over the mist, edge, and cloud tiers</title>
  <desc id="desc">Seven subtasks of a video analytics request. Capture and track run on mist devices, preprocess and classify on edge data centers, and detect, aggregate, and notify on the cloud.</desc>
  <style>
    .box { fill: #ffffff; stroke-width: 2; }
    .mist { stroke: #c96a1b; }
    .edge { stroke: #155799; }
    .cloud { stroke: #159957; }
    .band { fill-opacity: 0.07; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
    .name { font-weight: 600; font-size: 16px; }
    .small { font-size: 12px; fill: #57606a; }
    .edge-line { stroke: #57606a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .tier { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.08em; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1060" height="130" rx="12" class="band" fill="#c96a1b"/>
  <rect x="20" y="190" width="1060" height="150" rx="12" class="band" fill="#155799"/>
  <rect x="20" y="380" width="1060" height="150" rx="12" class="band" fill="#159957"/>

  <text x="40" y="48" class="label tier">MIST</text>
  <text x="40" y="218" class="label tier">EDGE</text>
  <text x="40" y="408" class="label tier">CLOUD</text>

  <rect x="120" y="55" width="210" height="72" rx="8" class="box mist"/>
  <text x="225" y="86" text-anchor="middle" class="label name">capture</text>
  <text x="225" y="108" text-anchor="middle" class="label small">2 000 MI, 5 KB out, 5 s</text>

  <rect x="730" y="55" width="220" height="72" rx="8" class="box mist"/>
  <text x="840" y="86" text-anchor="middle" class="label name">track</text>
  <text x="840" y="108" text-anchor="middle" class="label small">15 000 MI, 100 KB out</text>

  <rect x="420" y="215" width="230" height="72" rx="8" class="box edge"/>
  <text x="535" y="246" text-anchor="middle" class="label name">preprocess</text>
  <text x="535" y="268" text-anchor="middle" class="label small">6 000 MI, 20 KB out, 8 s</text>

  <rect x="730" y="215" width="220" height="72" rx="8" class="box edge"/>
  <text x="840" y="246" text-anchor="middle" class="label name">classify</text>
  <text x="840" y="268" text-anchor="middle" class="label small">50 000 MI, 50 KB out</text>

  <rect x="730" y="402" width="220" height="72" rx="8" class="box cloud"/>
  <text x="840" y="433" text-anchor="middle" class="label name">detect</text>
  <text x="840" y="455" text-anchor="middle" class="label small">80 000 MI, 10 KB out</text>

  <rect x="470" y="402" width="210" height="72" rx="8" class="box cloud"/>
  <text x="575" y="433" text-anchor="middle" class="label name">aggregate</text>
  <text x="575" y="455" text-anchor="middle" class="label small">3 000 MI, 20 KB out</text>

  <rect x="180" y="402" width="180" height="72" rx="8" class="box cloud"/>
  <text x="270" y="433" text-anchor="middle" class="label name">notify</text>
  <text x="270" y="455" text-anchor="middle" class="label small">500 MI, 1 KB out</text>

  <path class="edge-line" d="M 330 91 C 370 91, 390 251, 420 251"/>
  <text x="336" y="185" class="label small">5 KB</text>

  <path class="edge-line" d="M 650 251 C 690 251, 690 438, 730 438"/>
  <text x="665" y="340" class="label small">20 KB</text>

  <path class="edge-line" d="M 840 402 L 840 287"/>
  <text x="850" y="350" class="label small">10 KB</text>

  <path class="edge-line" d="M 950 438 C 1015 438, 1015 91, 950 91"/>
  <text x="990" y="270" class="label small">10 KB</text>

  <path class="edge-line" d="M 840 287 C 840 360, 760 438, 680 438"/>
  <text x="790" y="380" class="label small">50 KB</text>

  <path class="edge-line" d="M 730 91 C 680 91, 680 380, 680 414"/>
  <text x="650" y="360" class="label small">100 KB</text>

  <path class="edge-line" d="M 470 438 L 360 438"/>
  <text x="400" y="425" class="label small">20 KB</text>

  <text x="40" y="545" class="label small">Each arrow also carries the output of the parent, which is added to the request size of the child. The application latency, 12 s, is one deadline for the whole request.</text>
</svg>
