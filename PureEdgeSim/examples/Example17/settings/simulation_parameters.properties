# =============================================================================
# PureEdgeSim Example 17 parameters
# =============================================================================
# Scenario: context-aware deep reinforcement offloading. Devices reach the
# network over Wi-Fi or cellular, and every decision uses the application type,
# the task length, the battery level, the access technology, the device
# mobility, and the load of each tier. A small neural network approximates the
# value of each layer from those inputs, so a device with a low battery or a
# narrow cellular uplink learns to stay near the edge. Four edge data centers
# act as MEC hosts on a 2000 by 2000 meters map.
#
# One key=value pair per line. Lines starting with # are comments and blank
# lines are ignored. Keys are case-sensitive. Leading and trailing spaces are
# ignored, but inline comments are not supported: everything after a value is
# part of that value.
#
# Times are simulated time unless a parameter says otherwise. The parser
# validates each value while loading this file and stops the run with an error
# that names the offending parameter. Unknown keys are silently ignored, so
# only use the names listed below or in docs/configuration.md.
#
# Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (must be > 0). The run stops at this simulated
# time unless wait_for_all_tasks is true.
simulation_time=10

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. Smaller values are more accurate and make the run slower.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0). This only
# makes the console output readable; it does not change simulated time.
pause_length=3

# Number of generated tasks scheduled into the event queue at once (> 0).
# Larger batches reduce queue overhead but use more memory.
batch_size=100

# Seed for every random value used by the simulation (any whole number).
# When set, task sizes and lengths, arrival times, node capacities and device
# positions are all drawn from this seed, so the same scenario gives exactly the
# same results on every run. Leave it empty to get a different run each time,
# as in previous versions. Vary the seed between runs when you need several
# independent repetitions of the same scenario.
random_seed=17


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# Open the live Swing charts. Always disabled automatically in parallel mode.
display_real_time_charts=false

# Hide the chart window when an iteration ends.
auto_close_real_time_charts=true

# Seconds of simulated time between chart refreshes (0.01 to 60). Lower values
# look smoother but consume more CPU.
charts_update_interval=30

# Save chart images. Sequential runs also generate aggregate comparison charts
# from the CSV under "Final results/". No charts are produced in parallel mode.
save_charts=false

# Write the per-iteration text report. The results CSV is always written.
save_log_file=false

# Delete existing files in the output folder before the first iteration. Use
# with care, because the folder may contain results from earlier experiments.
clear_output_folder=true

# Enable very verbose per-event logging. Extremely slow on large scenarios.
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

# Map size in meters (> 0). If you change it, also update the edge data center
# locations in edge_datacenters.xml.
length=2000
width=2000

# Device-to-device (mist) communication range in meters (> 0). Two devices can
# exchange tasks only within this radius. It does not control the distance to
# an edge data center.
edge_devices_range=20

# Maximum distance in meters (> 0) between a device and the edge data center it
# connects to. The default topology connects each device to the closest edge
# data center within this radius. If the radius is too small, devices without a
# reachable edge server cannot offload to edge or edge-only architectures.
edge_datacenters_coverage=1200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# When true, the destination may download the application container before
# executing an offloaded task (container size comes from applications.xml).
# This adds WAN traffic and delay. When false, tasks execute directly.
enable_registry=false

# Where the container is downloaded from:
#   CLOUD  the first cloud node. This is the only mode implemented by the
#          default network model.
#   CACHE  demonstrated by the Example 7 custom network model, which caches
#          containers near clusters. With the default network model this value
#          performs no download.
# Case-sensitive. Has no effect when enable_registry is false.
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# When false, every device makes its own offloading decisions. When true, the
# decision is delegated to the orchestrator selected by deploy_orchestrator.
# Delegation adds network delay but enables global or cluster-level policies.
enable_orchestrators=false

# Where the orchestrator runs (case-sensitive):
#   CLOUD  first cloud data center
#   EDGE   closest edge data center
#   MIST   the device itself, which is equivalent to local decisions
#   other  the node in the orchestrators list with the lowest topology delay;
#          Example 7 uses CLUSTER for its cluster heads
# Individual nodes can also be marked with <isOrchestrator>true</isOrchestrator>
# in the XML files. Has no effect when enable_orchestrators is false.
deploy_orchestrator=CLOUD

# When true, the run continues after simulation_time until every generated task
# has succeeded or failed, which gives more complete results but can take much
# longer. When false, tasks still in flight at simulation_time stay unresolved.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# The simulation repeats for every device count from min to max (inclusive),
# stepping by edge_device_counter_size. The MIN and MAX values must be greater
# than 0 and max must be >= min. For a single run, set min = max.
min_number_of_edge_devices=300
max_number_of_edge_devices=300
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# false: each transfer completes in one step using the delay computed from the
#        link bandwidth. Fast, but does not model congestion.
# true:  transfers progress gradually and share link bandwidth during each
#        network_update_interval. Slower, but models contention and progressive
#        transfers.
realistic_network_model=false

# Seconds between transfer updates in the realistic model (>= 0.001). Smaller
# values improve accuracy and increase the number of events.
network_update_interval=1

# true:  all cloud traffic shares one WAN uplink and downlink, so transfers
#        compete for bandwidth. The WAN chart is shown only in this mode.
# false: each device has its own path to the cloud, and the WAN chart is hidden.
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth is in megabits per second (Mbps) and must be > 0. Latency is in
# seconds and is used both for routing (shortest path) and for delay
# accounting. Energy is in nanojoules per bit (nJ/bit); use 0 for a link with no
# energy cost. All latency and energy values must be >= 0.

# WAN: cloud access link.
wan_bandwidth=20
wan_latency=0.06
wan_nanojoules_per_bit=46.7

# MAN: links between edge data centers.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Wi-Fi: device access link.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Ethernet: wired link.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40000
ethernet_latency=0.002

# Cellular: mobile network (4G LTE values).
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

# Comma-separated lists. The sweep runs every architecture, then every
# algorithm, then every device count. Names are case-sensitive.
#
# Architectures: CLOUD_ONLY, EDGE_ONLY, MIST_ONLY, MIST_AND_CLOUD,
#                EDGE_AND_CLOUD, MIST_AND_EDGE, ALL
# Algorithms:    TRADE_OFF and ROUND_ROBIN are built in; a custom orchestrator
#                may accept other names.
orchestration_architectures=ALL
orchestration_algorithms=CONTEXT_AWARE
