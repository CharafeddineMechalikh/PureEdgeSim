# =============================================================================
# PureEdgeSim Example 8 parameters
# =============================================================================
# Scenario: a three-layer architecture (cloud, edge, mist) evaluated with the
# fuzzy-logic orchestrator defined in Example8FuzzyLogicOrchestrator and with
# the built-in round-robin orchestrator for comparison. Because orchestrators
# are disabled, each device applies the algorithm locally.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0).
simulation_time=10

parallel_simulation=false
update_interval=1
pause_length=3
batch_size=100


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

display_real_time_charts=true
auto_close_real_time_charts=true
# Seconds of simulated time between chart refreshes (0.01 to 60).
charts_update_interval=10
# Save chart images as bitmap files.
save_charts=true

save_log_file=true
clear_output_folder=false
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

length=200
width=200

# Device-to-device (mist) range in meters (> 0).
edge_devices_range=10

# Maximum distance between a device and its edge data center in meters (> 0).
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Each device makes its own offloading decision. The fuzzy-logic algorithm is
# applied locally by Example8FuzzyLogicOrchestrator.
enable_orchestrators=false

# Kept at MIST for documentation, but it has no effect while
# enable_orchestrators is false. If you enable orchestrators, MIST would also
# keep decisions local; use CLOUD or EDGE to delegate them to a remote node.
deploy_orchestrator=MIST

wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 300 devices (min = max).
min_number_of_edge_devices=300
max_number_of_edge_devices=300
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

realistic_network_model=false
network_update_interval=1

# Cloud traffic shares one WAN link and the WAN chart is displayed.
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth in Mbps (> 0), latency in seconds (>= 0), energy in nJ/bit (>= 0).

# WAN: cloud access link.
wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

# MAN: links between edge data centers.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Wi-Fi: device access link.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Ethernet: wired link. This example uses the higher energy value from the
# default configuration.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40000
ethernet_latency=0.002

# Cellular: mobile network (4G LTE values).
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

# Three-layer architecture (cloud, edge, and mist) for every run.
orchestration_architectures=ALL

# FUZZY_LOGIC is implemented by Example8FuzzyLogicOrchestrator; ROUND_ROBIN is
# built in. The comparator runs both algorithms over the same scenario.
orchestration_algorithms=FUZZY_LOGIC,ROUND_ROBIN
