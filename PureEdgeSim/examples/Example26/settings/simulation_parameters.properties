# =============================================================================
# PureEdgeSim Example 26 parameters
# =============================================================================
# Scenario: a pure edge fleet of one hundred fixed devices, more than half of
# them battery powered, with no server to offload to. Three application classes
# share the fleet, with the latency budgets, the traffic mix and the fleet size
# of the FTR-AdWOrch scenario of Safavifar, Mechalikh and Golpayegani (ICAART
# 2023): a health monitor that must answer in fifteen milliseconds, an augmented
# reality application with half a second of budget, and a background computation
# given thirty seconds. Two of the devices carry the orchestration,
# the first one is the primary, the second is a cold standby that only boots when
# the primary crashes, halfway through the run.
#
# Everything the example adds lives in its own classes: the Q-learning
# orchestrator that ranks the fleet with the rule it has learned, the device that
# puts hard real-time tasks at the head of its queue and pushes work away when it
# is almost out of battery, and the simulation manager that injects the crash and
# counts what it costs. No parameter here is needed by them, and nothing under
# com.mechalikh.pureedgesim changes for this example.
#
# The fault, the standby, the queue priority and the reallocation can each be
# switched off from the command line to compare the scenario with itself:
#
#   mvn exec:java -Dexec.mainClass="examples.Example26"
#   mvn exec:java -Dexec.mainClass="examples.Example26" -Dexample26.backup=false
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). Five minutes, a sixth of the thirty the
# paper runs: long enough for the agent to leave exploration behind and for the
# crash to fall in the middle of the run, short enough to read.
simulation_time=5

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. The devices do not move here, so only the energy accounting ticks.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0). One
# iteration only, so no pause.
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the run (any whole number). The seed pins
# the positions, the sizes and the arrival times, and therefore the second at
# which each rule is tried, so two runs with the same flags are identical.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# The per class figures the example reports are printed in the console and
# written to the CSV; the live charts are turned off to keep the run fast.
display_real_time_charts=false
auto_close_real_time_charts=true
charts_update_interval=10
save_charts=false

save_log_file=false
clear_output_folder=true
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Area, coverage and range
# -----------------------------------------------------------------------------

# Map size in meters (> 0).
length=200
width=200

# Device-to-device (mist) range in meters (> 0). It covers the whole map, so
# every device may serve every other one and the orchestrator has the full fleet
# to choose from. Shrink it to study a sparse fleet instead, but then a device
# that is out of range of the orchestrator cannot be served at all.
edge_devices_range=300

# Large enough for the edge data center of the scenario to reach every device.
# The architecture is MIST_ONLY, so no task is placed on that data center.
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Registry downloads are disabled: the containers are already on the devices, so
# what a device refuses here is its own storage and its own battery, not a
# download.
enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# The decisions are taken by the orchestrating devices, which is the whole point
# of the scenario: when the primary crashes, the requests in flight with it are
# lost and the fleet has to be re-pointed to the standby.
enable_orchestrators=true

# Any value other than CLOUD, EDGE and MIST means "the nodes marked as
# orchestrators in the XML files", which here are the two devices of the fleet.
# Each device picks the reachable one of them, and follows the standby when the
# primary dies.
deploy_orchestrator=DEVICE

# Wait for every task to finish, even after simulation_time, so that the
# per-class success rates of the run cover all the traffic and not only the part
# that had time to come back.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 100 devices (min = max), as in the paper. The step is
# unused. Twenty five of them can compute, the rest are sensors whose requests
# the twenty five have to carry.
min_number_of_edge_devices=100
max_number_of_edge_devices=100
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Static bandwidth and latency per link. Congestion would add noise that has
# nothing to do with the orchestration being studied.
realistic_network_model=false
network_update_interval=1

# One shared WAN for all devices instead of a link per device. No task reaches
# the cloud in this scenario.
one_shared_wan_network=false


# -----------------------------------------------------------------------------
# 8. Network parameters
# -----------------------------------------------------------------------------

wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
# One millisecond per wireless hop, five times less than the framework default.
# A request that is offloaded travels four hops (device to orchestrator,
# orchestrator to destination, and the results back the same way), so at the
# default five milliseconds the hops alone would spend the fifteen milliseconds
# the health monitor is given, and the task would be late before it reached any
# device. The radio is therefore made fast enough for the deadline of the paper
# to be a requirement the fleet can actually try to meet.
wifi_latency=0.001

ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Orchestration sweep
# -----------------------------------------------------------------------------

# Pure edge, one algorithm: the fleet alone serves the fleet, and the only way a
# task survives is the placement chosen by the learning orchestrator. The name is
# the one Example26FaultTolerantOrchestrator checks in its constructor.
orchestration_architectures=MIST_ONLY
orchestration_algorithms=FTR_ADWORCH
