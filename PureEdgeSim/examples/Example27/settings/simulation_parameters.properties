# =============================================================================
# PureEdgeSim Example 27 parameters
# =============================================================================
# Scenario: twenty phones upload a video clip to the cloud once a minute, and all
# of them share one metropolitan link. The clip is a megabyte and a half, so a
# request carries twelve megabits up; twenty devices at one clip a minute offer
# four megabits per second to a link given three, which is more than it can carry.
# The scenario therefore runs at one third over capacity, the backlog grows for
# the whole run, and the delay of a request depends on how much of the traffic
# ahead of it was still crossing the link when it arrived.
#
# The run evaluates two architectures at once. The cloud iteration is the
# congested one. The edge iteration serves the same traffic over the local link of
# the data center a hundred metres away, which is wide enough that nothing queues,
# so it is the reference the cloud delay has to be read against.
#
# The only class of this example, Example27CongestionAuditor, samples the delay
# breakdown of every request that reaches its end and prints the median, the
# ninetieth percentile and the maximum of the network time, which is where
# congestion shows up: not in the average, but in the tail.
#
# The same scenario runs with the transfers completing in one step, which is the
# framework default and what most simulators do:
#
#   mvn exec:java -Dexec.mainClass="examples.Example27"
#   mvn exec:java -Dexec.mainClass="examples.Example27" -Dexample27.realistic=false
#
# The second line reads linear-network-model.properties from this folder instead of
# this file. That file differs by one setting and by nothing else.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). Ten minutes, long enough for the backlog to
# build and for the tail of the delay distribution to settle.
simulation_time=10

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. Nothing moves and no battery empties here, so it only ticks.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0).
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the run (any whole number). The poisson
# arrivals are drawn from it, so the two iterations and the two network models see
# the same traffic.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# The delay distribution the example reports is printed in the console and written
# to the CSV; the live charts are turned off to keep the run fast.
display_real_time_charts=false
auto_close_real_time_charts=true
charts_update_interval=10
save_charts=false

save_log_file=false
clear_output_folder=true
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Area, coverage and range
# -----------------------------------------------------------------------------

# Map size in meters (> 0).
length=200
width=200

# Device to device (mist) range in meters (> 0). No task is served by a device
# here, so it only has to be wide enough not to matter.
edge_devices_range=300

# Large enough for the edge data center to reach every device of the map.
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Containers are already where they need to be. A registry download would add
# traffic over the congested link and mix two effects that this scenario is about
# separating.
enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Each device decides for itself, with the built in TRADE_OFF policy. The
# orchestrator is not the subject here, the link is.
enable_orchestrators=false
deploy_orchestrator=CLOUD

# Wait for every task to finish, even after simulation_time. With a link that
# cannot carry the traffic offered to it, the tasks generated last are exactly the
# interesting ones: they are the ones queued behind everything that came before.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: twenty devices (min = max). Twenty phones at one clip per
# minute offer four megabits per second to the three the link can carry.
min_number_of_edge_devices=20
max_number_of_edge_devices=20
edge_device_counter_size=20


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Transfers advance by one network update interval at a time and stay on the link
# until their bytes have really crossed it. This is the setting the example is
# about, and the ablation flips it.
realistic_network_model=true

# Period in seconds (>= 0.001) at which the links update the progress of their
# transfers. It is the accuracy knob of the realistic model, and it has a price: a
# hop cannot finish between two updates, so every transfer costs at least one
# interval of simulated time whatever its size. A tenth of a second keeps that
# floor well under the transfer times of this scenario, which are seconds.
network_update_interval=0.1

# All the cloud traffic crosses one uplink and one downlink, which is what makes
# the devices compete. With this off each device has its own path to the cloud and
# there is no contention to measure.
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Network parameters
# -----------------------------------------------------------------------------

# The bottleneck: three megabits per second for the metropolitan link, against the
# four the devices offer. The sixty milliseconds of latency is the framework
# default and is small next to the transfer times.
wan_bandwidth=3
wan_latency=0.06
wan_nanojoules_per_bit=46.7

man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# The access links are wide, so nothing queues in front of the shared uplink: the
# delay a request sees is the delay of the congested link and of nothing else.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Orchestration sweep
# -----------------------------------------------------------------------------

# The congested architecture and the reference one, in one run, on the same
# traffic. The edge data center and the cloud hold the same number of cores times
# the same MIPS, so the two iterations differ by their network alone.
orchestration_architectures=CLOUD_ONLY,EDGE_ONLY
orchestration_algorithms=TRADE_OFF
