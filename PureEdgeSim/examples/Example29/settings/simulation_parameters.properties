# =============================================================================
# PureEdgeSim Example 29 parameters
# =============================================================================
# Scenario: sixty phones send one small request a minute to the cloud, and all of
# them share one metropolitan uplink of a megabit per second. A request is two
# hundred kilobits up and forty down, so the healthy load is a fifth of what the
# link carries: nothing queues, and every request meets its twenty seconds.
#
# At four minutes the link stops delivering for thirty seconds. Every request that
# reaches it in that window is lost, and what happens next is decided by the
# client, not by the scenario, so the settings are the same in all four runs:
#
#   mvn exec:java -Dexec.mainClass="examples.Example29"
#   mvn exec:java -Dexec.mainClass="examples.Example29" -Dexample29.policy=BUDGET
#   mvn exec:java -Dexec.mainClass="examples.Example29" -Dexample29.policy=STORM
#   mvn exec:java -Dexec.mainClass="examples.Example29" -Dexample29.policy=STORM -Dexample29.outage=false
#
# The realistic network model is what makes the retries cost anything: a transfer
# stays on the link until its bytes have crossed it, so a retry competes with the
# transfers already queued. With the one step model every retry would finish in
# the same instant it was sent.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). Ten minutes, which leaves six minutes of
# healthy traffic after the outage for the backlog to drain and settle.
simulation_time=10

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. Nothing moves and no battery empties here, so it only ticks.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0).
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the run (any whole number). The poisson
# arrivals are drawn from it, so all four runs see the same request times and
# differ only by the client.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Display and output
# -----------------------------------------------------------------------------

# Show the live charts window. Off, so the run works on a machine without a
# display, as in the continuous integration job.
display_real_time_charts=false

# Close the charts window automatically at the end of the run.
auto_close_real_time_charts=true

# Period in seconds between two updates of the live charts.
charts_update_interval=10

# Save the charts as PNG and SVG at the end of the run.
save_charts=false

# Write the console output to a file in the output folder.
save_log_file=false

# Delete the output folder before the run.
clear_output_folder=true

# Log the generation and movement of every task and device, which is far too
# verbose for a scenario of this size.
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Topology
# -----------------------------------------------------------------------------

# Size of the simulated area in metres (> 0).
length=200
width=200

# Range in metres within which an edge device reaches its access point (> 0).
edge_devices_range=300

# Range in metres within which an edge device reaches an edge data center (> 0).
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Container registry
# -----------------------------------------------------------------------------

# Download the application container from a registry before executing it. Off:
# the container transfer is not what this scenario measures.
enable_registry=false

# Where the registry is hosted (CLOUD or EDGE).
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Deploy an orchestrator rather than letting every device decide alone.
enable_orchestrators=true

# Where the orchestrator runs. CLOUD, because the request that the uplink drops
# is then the one carrying the offloading decision, and the uplink is the subject
# of the example.
deploy_orchestrator=CLOUD

# Wait for the tasks that are still in flight when the duration is reached, up
# to ninety nine percent of them, so that the last requests of the storm are
# counted instead of being censored by the end of the run.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge devices
# -----------------------------------------------------------------------------

# Number of devices in the fleet. One scenario, so the minimum and the maximum
# are the same and the sweep has a single iteration.
min_number_of_edge_devices=60
max_number_of_edge_devices=60
edge_device_counter_size=60


# -----------------------------------------------------------------------------
# 7. Network
# -----------------------------------------------------------------------------

# Let transfers advance over their link in steps instead of completing in one
# update. On: a transfer stays on the link until its bytes have crossed it, so a
# retry queues behind the transfers already in flight.
realistic_network_model=true

# Period in seconds at which the transfers advance (> 0). Well under the transfer
# times it resolves, so the queue is described rather than approximated.
network_update_interval=0.1

# All the cloud traffic shares one uplink. On: this is the resource the fleet
# competes for, and the one that goes down at four minutes.
one_shared_wan_network=true


# Metropolitan uplink: one megabit per second, which is ten times the healthy
# load of the fleet and four times what the storm offers it.
# Megabits per second.
wan_bandwidth=1
# Seconds of propagation delay.
wan_latency=0.06
# Nanojoules per bit.
wan_nanojoules_per_bit=46.7

# Metropolitan area network, inside the operator.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Local wifi, from the devices to their access point.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Wired links inside a data center.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

# Cellular access, unused here: every device is on wifi. Kept because the
# parameters file is complete.
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 8. Scenarios to sweep
# -----------------------------------------------------------------------------

# The architecture of the run. One only, so that the four invocations differ by
# the client and by nothing else.
orchestration_architectures=CLOUD_ONLY

# The placement algorithm. TRADE_OFF is the default and is not what the example
# compares.
orchestration_algorithms=TRADE_OFF
