# =============================================================================
# PureEdgeSim Example 28 parameters
# =============================================================================
# Scenario: forty battery powered devices, all of them computing and all of them
# generating two requests a minute, decide between themselves whose battery pays
# for whose task. Nothing moves, nothing is offloaded outside the fleet, and no
# link is narrow: the only way anything fails here is a battery reaching zero.
#
# The batteries are the scenario. Each device starts with between sixteen and
# thirty minutes of its own idle draw while the run lasts fifteen minutes, so no
# device dies of staying awake: a device only goes when the work it was handed
# pushes its drain past what it holds. Over a run the fleet burns about 32
# watt-hours, 24 of them doing nothing and 8 computing, and those 8 are the only
# part a placement policy can move. Which devices carry them is decided by two
# rules:
#
#   -Dexample28.batteryAware=false  ranks the candidates by how fast they would
#                                   finish the task instead of by the charge they
#                                   would still be left with, so the work gathers on
#                                   the quick, thirsty gateways and kills them.
#   -Dexample28.perTask=false       lets the framework reuse the placement of the
#                                   first task of each device for all the rest, which
#                                   turns one decision into a commitment to serve one
#                                   neighbour for the whole run and gathers the work
#                                   again even under the battery-aware ranking.
#
# Both switches default to on, which is the policy the example argues for. The run
# below reads the whole fleet at the end of every simulated minute, so the shape of
# the collapse, not just its endpoint, is printed.
#
#   mvn exec:java -Dexec.mainClass="examples.Example28"
#   mvn exec:java -Dexample28.batteryAware=false -Dexec.mainClass="examples.Example28"
#   mvn exec:java -Dexample28.perTask=false -Dexec.mainClass="examples.Example28"
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). Fifteen, which is the upper end of the
# battery lifetimes the fleet is drawn from: the run outlives some devices and is
# outlived by others.
simulation_time=15

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. This is the accuracy of the drain: idle power is booked one second at
# a time, and a device is checked for death once a second, so the death times below
# are quantised to this tick.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0).
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the run (any whole number). The task
# generator draws the minute of each request, the length of each task and which
# device runs which application from it, so the same seed gives the same fleet, the
# same traffic and the same deaths to every arm of the ablation.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# What the fleet did is printed in the console and written to the CSV; the live
# charts are turned off to keep the run fast.
display_real_time_charts=false
auto_close_real_time_charts=true
charts_update_interval=10
save_charts=false

save_log_file=false
clear_output_folder=true
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Area, coverage and range
# -----------------------------------------------------------------------------

# Map size in meters (> 0).
length=200
width=200

# Device to device (mist) range in meters (> 0). Wider than the diagonal of the
# map, so every device is a candidate for every task and no placement is refused for
# geography. A fleet that could only reach its neighbours would die of something
# else than its battery.
edge_devices_range=300

# Large enough for the edge data center to reach every device of the map. It is
# never asked to compute anything; it only has to exist for the topology.
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Containers are already where they need to be. A registry download would put
# energy into the radio and time on the link, and both would be counted as if they
# were the cost of the placement policy.
enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Each device decides for itself. A dedicated orchestrator node would be a device
# with a battery of its own dying in the middle of the run, taking the decisions of
# the fleet with it, which is Example26 and not this one.
enable_orchestrators=false
deploy_orchestrator=MIST

# Wait for every task to finish, even after simulation_time. A task that is still
# queued on a device that dies is one of the things being measured, and cutting the
# run short would hide it.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: forty devices (min = max), ten of each of the four types
# of edge_devices.xml, all of them on a battery and all of them generating traffic.
min_number_of_edge_devices=40
max_number_of_edge_devices=40
edge_device_counter_size=40


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Transfers complete in one step. The scenario is not about the network: the access
# links below are wide enough that no transfer takes as long as a tenth of a second,
# so the realistic model would only quantise the delays to its update interval and
# slow the run down for nothing.
realistic_network_model=false

# Period in seconds (>= 0.001) at which the links update the progress of their
# transfers. Read by the realistic model only, which this scenario does not use.
network_update_interval=0.1

# All the devices share one wide area path to the cloud. Irrelevant here: no task
# leaves the fleet.
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Network parameters
# -----------------------------------------------------------------------------

# Wide enough that a request is never the reason a task is late. The largest payload
# of the scenario is fifty kilobytes, which crosses these links in a fraction of a
# millisecond.
wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Orchestration sweep
# -----------------------------------------------------------------------------

# One architecture, one algorithm: the fleet serves itself, and the only variable is
# the rule that decides which device serves. The algorithm name is read by
# Example28BatteryAwareOrchestrator, which refuses to run under another name.
orchestration_architectures=MIST_ONLY
orchestration_algorithms=BATTERY_AWARE
