# =============================================================================
# PureEdgeSim Example 25 parameters
# =============================================================================
# Scenario: one hour of a recorded production workload. Example25TraceTaskGenerator
# reads trace/azure_llm_code_1h.csv, the code completion sample of the Azure LLM
# inference trace published with the Splitwise paper, and turns every recorded
# invocation into one request: its arrival second, its prompt and completion
# sizes, its compute length and its latency budget all come from the file. The
# 8819 requests of the hour are handed to the 50 devices in turn, and the only
# edge data center of the scenario is sized so that the mean load stays near 40
# percent of its capacity: what breaks requests is the burstiness of the trace,
# not the average rate.
#
# Run the same scenario twice to compare: by default the trace is replayed,
# while -Dexample25.syntheticBaseline=true drops the custom generator and lets
# the default one draw the requests at the mean rate and mean sizes of the same
# trace, with poisson gaps. The two runs differ only in how real their traffic
# is.
#
# The architecture is EDGE_ONLY: every request is served by the edge server, so
# the WAN and the cloud stay out of the comparison. The devices neither move nor
# run out of battery, for the same reason.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). The recorded hour ends at 3436 s, so 58
# minutes replay all of it; the last minute leaves room for the requests that
# are still running when the trace stops.
simulation_time=58

# Run the scenario sweep in parallel with min(CPU cores, scenario count)
# workers. Parallel mode disables live charts and changes output file names.
parallel_simulation=false

# Period in seconds (>= 0.01) of the mobility update and the static energy
# accounting. The devices do not move here, so only the energy accounting ticks.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0). One
# iteration only, and the run is long, so no pause.
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
# Larger batches reduce queue overhead but use more memory.
batch_size=100

# Seed for every random value used by the simulation (any whole number). The
# replay of the trace draws nothing, so the seed only matters for the synthetic
# baseline, where it fixes the poisson gaps and the sampled sizes.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# Live charts of a one hour run are slow; the reports are read from the CSV.
display_real_time_charts=false
auto_close_real_time_charts=true
charts_update_interval=10
save_charts=false

save_log_file=false
clear_output_folder=true
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Area, coverage and range
# -----------------------------------------------------------------------------

# Map size in meters (> 0).
length=2000
width=2000

# Device-to-device (mist) range in meters (> 0). Unused by this scenario: the
# architecture is EDGE_ONLY, so no task is placed at the mist tier.
edge_devices_range=50

# Large enough for the single edge data center to reach every device on the
# 2000 m map.
edge_datacenters_coverage=2000


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Registry downloads are disabled in this example, so no container is pulled
# and tasks execute directly on the selected node.
enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# The simulation manager decides, as it does for the default orchestrator.
enable_orchestrators=false

# EDGE: the closest edge data center receives the decisions. With EDGE_ONLY
# there is a single candidate anyway.
deploy_orchestrator=EDGE

# Wait for every task to finish, even after simulation_time. The last requests
# of the trace arrive a few seconds before the end of the run.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 50 devices (min = max). The step is unused when
# min = max.
min_number_of_edge_devices=50
max_number_of_edge_devices=50
edge_device_counter_size=50


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Static bandwidth and latency per link. The realistic model would add
# interference that has nothing to do with the workload being replayed.
realistic_network_model=false
network_update_interval=1

# One shared WAN for all devices instead of a link per device.
one_shared_wan_network=false


# -----------------------------------------------------------------------------
# 8. Network parameters
# -----------------------------------------------------------------------------

wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Orchestration sweep
# -----------------------------------------------------------------------------

# One architecture, one algorithm: the edge server alone serves the replayed
# requests, and the synthetic baseline uses the same placement, so the only
# difference between the two runs is the traffic.
orchestration_architectures=EDGE_ONLY
orchestration_algorithms=TRADE_OFF
