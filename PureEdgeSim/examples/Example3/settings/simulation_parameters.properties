# =============================================================================
# PureEdgeSim Example 3 parameters
# =============================================================================
# Scenario: edge and cloud offloading with one orchestrator on every edge data
# center. Tasks are sent to the closest edge data center, which decides whether
# to execute them locally, on another edge data center, or in the cloud.
#
# Compare with enable_orchestrators=false, and add CLOUD_ONLY to
# orchestration_architectures to include the cloud-only baseline.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0).
simulation_time=10

# Run the sweep in parallel with min(CPU cores, scenario count) workers.
parallel_simulation=false

# Mobility and static-energy update period in seconds (>= 0.01).
update_interval=1

# Wall-clock pause between sequential iterations in seconds (>= 0).
pause_length=3

# Tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the simulation (any whole number).
# When set, task sizes and lengths, arrival times, node capacities and device
# positions are all drawn from this seed, so the same scenario gives exactly the
# same results on every run. Leave it empty to get a different run each time,
# as in previous versions. Vary the seed between runs when you need several
# independent repetitions of the same scenario.
random_seed=


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

display_real_time_charts=true
auto_close_real_time_charts=true
# Seconds of simulated time between chart refreshes (0.01 to 60).
charts_update_interval=10
save_charts=false

# The per-iteration text report is disabled; the CSV is always written.
save_log_file=false
# Clear the output folder before the run so previous results do not mix in.
clear_output_folder=true
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

# A larger 2000 x 2000 area instead of the default 200 x 200.
length=2000
width=2000

# Device-to-device (mist) range in meters (> 0).
edge_devices_range=10

# Large enough for every edge data center to reach the devices it serves and
# for the edge data centers to reach one another. With a 2000 m map, 1000 m
# covers the whole area; increase it further if you enlarge the map.
edge_datacenters_coverage=1000


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Registry downloads are disabled in this example, so no container is pulled
# and tasks execute directly on the selected node.
enable_registry=false
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Edge data centers act as orchestrators. Each device sends its tasks to the
# closest edge data center, which chooses the destination. Disable this to let
# every device decide locally and compare the results.
enable_orchestrators=true

# EDGE: the closest edge data center orchestrates the task. This is required
# for the cooperative edge behavior demonstrated here.
deploy_orchestrator=EDGE

# Wait for every task to finish, even after simulation_time.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 500 devices (min = max). The step is unused when
# min = max.
min_number_of_edge_devices=500
max_number_of_edge_devices=500
edge_device_counter_size=400


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

realistic_network_model=false
network_update_interval=1

# One shared WAN link is disabled, so cloud transfers use independent paths and
# the WAN real-time chart is hidden. The high WAN bandwidth keeps cloud delays
# low in this scenario.
one_shared_wan_network=false


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth in Mbps (> 0), latency in seconds (>= 0), energy in nJ/bit (>= 0).

# WAN: cloud access link.
wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

# MAN: links between edge data centers.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Wi-Fi: device access link.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Ethernet: wired link. This example uses 40 nJ/bit instead of the default
# 40000 nJ/bit.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

# Cellular: mobile network (4G LTE values).
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

# Evaluate edge and cloud execution. Add CLOUD_ONLY to also run the cloud-only
# baseline used for comparison in this example, for example:
# orchestration_architectures=EDGE_AND_CLOUD,CLOUD_ONLY
orchestration_architectures=EDGE_AND_CLOUD
orchestration_algorithms=TRADE_OFF
