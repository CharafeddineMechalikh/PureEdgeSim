# =============================================================================
# PureEdgeSim Example 6 parameters
# =============================================================================
# Scenario: parallel execution of every architecture with MIST orchestration,
# container downloads from the cloud registry, and the realistic network model.
# This example shows contention and transfer progress rather than fast,
# coarse-grained estimates.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0).
simulation_time=10

# Run the scenario sweep in parallel. Live charts are disabled automatically,
# and output file names include the scenario identifier.
parallel_simulation=true

# Mobility and static-energy update period in seconds (>= 0.01).
update_interval=1

# Wall-clock pause between sequential iterations in seconds (>= 0). Unused when
# simulations run in parallel.
pause_length=3

# Tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed for every random value used by the simulation (any whole number).
# When set, task sizes and lengths, arrival times, node capacities and device
# positions are all drawn from this seed, so the same scenario gives exactly the
# same results on every run. Leave it empty to get a different run each time,
# as in previous versions. Vary the seed between runs when you need several
# independent repetitions of the same scenario.
random_seed=


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# Charts are not available in parallel mode. The values are kept consistent
# with that behavior so the configuration also works with parallel mode off.
display_real_time_charts=false
auto_close_real_time_charts=false
# Seconds of simulated time between chart refreshes (0.01 to 60).
charts_update_interval=10
save_charts=false

save_log_file=false
clear_output_folder=false
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

length=200
width=200

# Device-to-device (mist) range in meters (> 0).
edge_devices_range=20

# Maximum distance between a device and its edge data center in meters (> 0).
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Registry downloads are enabled. With realistic transfers, each container
# download consumes bandwidth over several network updates, which is the
# behavior this example demonstrates.
enable_registry=true
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# With MIST deployment, each device is its own orchestrator: the offloading
# decision is made locally, exactly as if this option were disabled. Use CLOUD
# or EDGE to delegate decisions to a remote node instead.
enable_orchestrators=true
deploy_orchestrator=MIST

# Stop at simulation_time instead of waiting for every task. Tasks still in
# flight then remain unresolved, so do not compare their failure rate directly
# with runs that use wait_for_all_tasks=true.
wait_for_all_tasks=false


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 100 devices (min = max).
min_number_of_edge_devices=100
max_number_of_edge_devices=100
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Transfers progress over time and share bandwidth, modeling contention.
realistic_network_model=true
# Seconds between transfer updates (>= 0.001).
network_update_interval=1

# Each device has an independent path to the cloud, so cloud transfers do not
# compete for one WAN link and the WAN chart is hidden.
one_shared_wan_network=false


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth in Mbps (> 0), latency in seconds (>= 0), energy in nJ/bit (>= 0).

# WAN: cloud access link.
wan_bandwidth=1000
wan_latency=0.06
wan_nanojoules_per_bit=46.7

# MAN: links between edge data centers.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Wi-Fi: device access link.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Ethernet: wired link.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

# Cellular: mobile network (4G LTE values).
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

# Every architecture, evaluated with a single round-robin algorithm.
orchestration_architectures=ALL
orchestration_algorithms=ROUND_ROBIN
