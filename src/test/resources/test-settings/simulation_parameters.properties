# =============================================================================
# PureEdgeSim test settings
# =============================================================================
# Fixture for the unit and integration test suite. This is not a research
# configuration: durations and device counts are kept small so the tests finish
# quickly. Some test classes assert these values, so change them only together
# with the tests.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# One simulated minute.
simulation_time=1
parallel_simulation=false
update_interval=1
# No wall-clock pause between iterations.
pause_length=0
batch_size=100


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

# No Swing windows or chart files during automated runs.
display_real_time_charts=false
auto_close_real_time_charts=true
charts_update_interval=30
save_charts=false

save_log_file=false
clear_output_folder=false
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

length=200
width=200
# Generous mist range so device-to-device paths exist in the small test map.
edge_devices_range=50
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# Registry downloads are disabled to keep the tests independent of WAN timing.
# CACHE is kept for consistency with the original fixture; it is inert while the
# registry is disabled.
enable_registry=false
registry_mode=CACHE


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

enable_orchestrators=false
deploy_orchestrator=CLOUD

# Do not extend the run to finish every task; the tests only need the
# configured simulated duration.
wait_for_all_tasks=false


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 20 devices.
min_number_of_edge_devices=20
max_number_of_edge_devices=20
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

# Exercise the progressive-transfer path in the tests.
realistic_network_model=true
network_update_interval=1
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth in Mbps (> 0), latency in seconds (>= 0), energy in nJ/bit (>= 0).

# WAN: cloud access link.
wan_bandwidth=20
wan_latency=0.06
wan_nanojoules_per_bit=46.7

# MAN: links between edge data centers.
man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

# Wi-Fi: device access link.
wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Ethernet: wired link.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40000
ethernet_latency=0.002

# Cellular: mobile network (4G LTE values).
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

orchestration_architectures=CLOUD_ONLY,EDGE_ONLY,MIST_ONLY,MIST_AND_CLOUD,EDGE_AND_CLOUD,MIST_AND_EDGE,ALL
orchestration_algorithms=TRADE_OFF,ROUND_ROBIN
