# =============================================================================
# PureEdgeSim Example 7 parameters
# =============================================================================
# Scenario: container caching with cluster-head orchestration. Edge devices are
# grouped into clusters; each cluster head decides where its members' tasks
# run. Frequently used containers are cached within the cluster instead of
# being downloaded from the cloud registry every time.
#
# Switch registry_mode to CLOUD to compare with the traditional strategy that
# pulls every container from the remote registry.
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). This scenario runs longer so that
# caching and cluster re-selection have time to affect the results.
simulation_time=60

parallel_simulation=false
update_interval=1
pause_length=3
batch_size=100

# Seed for every random value used by the simulation (any whole number).
# When set, task sizes and lengths, arrival times, node capacities and device
# positions are all drawn from this seed, so the same scenario gives exactly the
# same results on every run. Leave it empty to get a different run each time,
# as in previous versions. Vary the seed between runs when you need several
# independent repetitions of the same scenario.
random_seed=


# -----------------------------------------------------------------------------
# 2. Charts and logs
# -----------------------------------------------------------------------------

display_real_time_charts=true
auto_close_real_time_charts=true
# Refresh every simulated second, which is useful for this small map but costs
# more CPU than the default 30 seconds (allowed range 0.01 to 60).
charts_update_interval=1
save_charts=false

save_log_file=true
clear_output_folder=false
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Map and wireless range (meters)
# -----------------------------------------------------------------------------

# Small area so that all devices are close to one another, which makes the
# cache comparisons easier to interpret.
length=100
width=100

# Device-to-device (mist) range in meters (> 0).
edge_devices_range=20

# Maximum distance between a device and its edge data center in meters (> 0).
edge_datacenters_coverage=200


# -----------------------------------------------------------------------------
# 4. Application registry (container download)
# -----------------------------------------------------------------------------

# The registry is enabled: an offloaded task may need its container before it
# can execute. CACHE lets the Example 7 custom network model serve it from
# cluster caches; CLOUD downloads it from the first cloud node whenever the
# destination is not a cloud node.
enable_registry=true
registry_mode=CACHE


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Cluster heads act as orchestrators. They are selected by
# Example7ClusteringDevice, which requires the exact value CLUSTER below.
enable_orchestrators=true

# Must match the identifier used in Example7ClusteringDevice. Any other value
# selects the lowest-delay node in the orchestrators list instead, so cluster
# heads are not formed and the caching behavior is not exercised.
deploy_orchestrator=CLUSTER

wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge device sweep
# -----------------------------------------------------------------------------

# A single configuration: 300 devices (min = max).
min_number_of_edge_devices=300
max_number_of_edge_devices=300
edge_device_counter_size=100


# -----------------------------------------------------------------------------
# 7. Network model
# -----------------------------------------------------------------------------

realistic_network_model=false
network_update_interval=1

# All devices are in the same area and share one WAN link. This is required to
# compare CACHE against CLOUD fairly, and it enables the WAN chart.
one_shared_wan_network=true


# -----------------------------------------------------------------------------
# 8. Link rates (network values courtesy of the LEAF simulator)
# -----------------------------------------------------------------------------

# Bandwidth in Mbps (> 0), latency in seconds (>= 0), energy in nJ/bit (>= 0).
# The shared WAN is limited to 300 Mbps so that container downloads have a
# visible effect on transfer delays and WAN utilization.
wan_bandwidth=300
wan_latency=0.06
wan_nanojoules_per_bit=46.7

man_bandwidth=1000
man_latency=0.01
man_nanojoules_per_bit=0

wifi_bandwidth=1300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 9. Scenario matrix
# -----------------------------------------------------------------------------

# Only edge devices execute tasks in this scenario.
orchestration_architectures=MIST_ONLY
orchestration_algorithms=ROUND_ROBIN
